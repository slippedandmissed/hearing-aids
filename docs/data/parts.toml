# Bill of materials and cost model. Prices are ESTIMATES in GBP (low/high, per unit unless stated) from shop listings seen during the design;
# confirm against live quotes. `group` drives the cost chart; JLC assembled parts are listed per PCB order in the manual (from pcb/fab/*_BOM.csv).
# kind: order = lump-sum quote estimate for a whole order, part = per-unit item, calc = computed by docs/figures/tables.py

