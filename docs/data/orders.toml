# Ledger of orders: ONE ENTRY PER MOVEMENT OF MONEY, broken down into line items (GBP). Read by docs/figures/tables.py and costs.py.
#
# status = "paid"    : amounts are the real ones from the invoice. `paid_total` is what the invoice says was paid; the build FAILS if the lines
#                      do not add up to it (add a "Rounding" line for pennies). Discounts are NEGATIVE lines.
# status = "planned" : not ordered yet; each line has low/high estimates (and qty) from shop listings seen during the design. Move an order to
#                      "paid" when it is placed: replace its estimates by the invoice lines.
# status = "owned"   : already in hand, costs nothing.
#
# category: Parts | Manufacturing (made-to-order boards and prints) | Labour (assembly service) | Fees (setup, tooling, extended-part fees)
#           | Consumables | Shipping | Tax | Discounts | Rounding
# Add a category by using a new name; the tables and charts pick it up.

[rates]
# JLC3DP quote, 2026-11-22, MJF PA12-HP, 10 representative parts (USD): every file costs max(minimum, per_cm3 x volume); dyeing black adds about 0.10 on a small part.
print_usd_min = 0.95
print_usd_per_cm3 = 0.339
print_usd_dye_small = 0.10          # per black part; the bee base (a large part) is not quoted separately, so the same figure is used: ESTIMATE
usd_to_gbp = 0.7625                 # the rate on the JLCPCB invoice of the day before (USD 124.37 = GBP 94.84); also used for the JLC3DP order, whose invoice is in USD only
print_black = ["clip", "bee_base"]  # file name prefixes printed black (dyed); the rest is natural grey

