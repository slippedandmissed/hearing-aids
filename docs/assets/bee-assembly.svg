<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Bee box, base seen from the cover side with the cover off. HAND-AUTHORED SOURCE. Drawn in millimetres inside the scaled group (5 px per mm), origin = thorax top-left.
     Numbers from cad/bee_box.py (thorax 62 x 46, abdomen 44 wide, carrier 56 x 40 with M2 posts at x = +-25.4 from the centre, head ball with a 6.2 mm chain hole) and
     pcb/carrier/build_carrier.py (carrier origin at thorax (3,3), XIAO 21 x 17.8 at board (30,21), switch at board x=19.5, JST at board (11,31), ear blocks at board x 3.9-13.4 and 42.7-52.1).
     Checked 2026-11-23; the battery lead route and the slot positions are schematic. -->
<style>
 .t{font-size:14px;fill:#1f2933} .tb{font-size:14px;fill:#1f2933;font-weight:700} .m{font-size:12.5px;fill:#6b7785}
 .g{font-size:2.3px;fill:#1f2933;font-family:Helvetica Neue,Helvetica,Arial,sans-serif} .gm{font-size:2.1px;fill:#4a5561;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
 .n{font-size:3px;fill:#fff;font-weight:700;text-anchor:middle;font-family:Helvetica Neue,Helvetica,Arial,sans-serif} .nb{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
</style>
<rect width="640" height="560" fill="#fff"/>
<text x="14" y="22" class="tb">Bee box, cover off (seen from the cover side)</text>
<g transform="translate(24,100) scale(5)">
  <!-- head, thorax, abdomen -->
  <circle cx="31" cy="-6" r="9" fill="#f5c518" stroke="#1f2933" stroke-width=".3"/><circle cx="31" cy="-6" r="3.1" fill="#fff" stroke="#1f2933" stroke-width=".25" stroke-dasharray=".8 .6"/>
  <rect x="9" y="40" width="44" height="46" rx="9" fill="#f5c518" stroke="#1f2933" stroke-width=".3"/>
  <rect x="0" y="0" width="62" height="46" rx="5" fill="#f5c518" stroke="#1f2933" stroke-width=".3"/>
  <rect x="2" y="2" width="58" height="42" rx="4" fill="#fff6d6" stroke="#b8a04a" stroke-width=".2"/>
  <!-- 1 battery -->
  <rect x="16" y="52" width="30" height="31" rx="1" fill="#7a8fa6" stroke="#1f2933" stroke-width=".25"/><text class="g" x="31" y="68" text-anchor="middle" style="fill:#fff">LiPo</text>
  <!-- 2 carrier and posts -->
  <rect x="3" y="3" width="56" height="40" rx="9" fill="#dcefe3" stroke="#2e7d5b" stroke-width=".3"/>
  <rect x="22.5" y="15.1" width="21" height="17.8" rx=".8" fill="#e8eef5" stroke="#1f2933" stroke-width=".2"/><text class="gm" x="33" y="25" text-anchor="middle">XIAO</text>
  <circle cx="5.6" cy="23" r="2.1" fill="#7a5fd0" stroke="#1f2933" stroke-width=".2"/><circle cx="56.4" cy="23" r="2.1" fill="#7a5fd0" stroke="#1f2933" stroke-width=".2"/>
  <rect x="18.5" y="-1" width="2.4" height="4" fill="#8a949e" stroke="#1f2933" stroke-width=".2"/><rect x="17.3" y="3" width="4.8" height="3" fill="#f4f1ea" stroke="#1f2933" stroke-width=".2"/>
  <rect x="6" y="31" width="9" height="6" fill="#f4f1ea" stroke="#1f2933" stroke-width=".2"/>
  <path d="M24 52 V47 C24 40 2.6 44 2.6 38 V33.4 H6.5" fill="none" stroke="#d64545" stroke-width=".5"/><path d="M26 52 V47.6 C26 41 4.2 45.4 4.2 39 V35.2 H6.5" fill="none" stroke="#1f2933" stroke-width=".5"/>
  <!-- ear ribbons through top slots with a loop -->
  <rect x="7" y="-1.2" width="9.5" height="2.4" fill="#fff" stroke="#1f2933" stroke-width=".2"/><rect x="45.5" y="-1.2" width="9.5" height="2.4" fill="#fff" stroke="#1f2933" stroke-width=".2"/>
  <path d="M10 8 C10 14 18 14 18 8 C18 4 12 4 11 1 V-8" fill="none" stroke="#e5489b" stroke-width=".7"/><path d="M52 8 C52 14 44 14 44 8 C44 4 50 4 51 1 V-8" fill="none" stroke="#2f8bd6" stroke-width=".7"/>
  <!-- usb opening on the right wall -->
  <rect x="59.6" y="19" width="2.4" height="9" fill="#fff" stroke="#1f2933" stroke-width=".2"/>
  <!-- badges -->
  <circle cx="31" cy="76" r="2.6" fill="#1f2933" opacity="0"/>
  <circle cx="48" cy="62" r="3" fill="#1f2933"/><text class="n" x="48" y="63.1">1</text>
  <circle cx="5.6" cy="17" r="3" fill="#1f2933"/><text class="n" x="5.6" y="18.1">2</text>
  <circle cx="19" cy="36" r="3" fill="#1f2933"/><text class="n" x="19" y="37.1">3</text>
  <circle cx="27" cy="9" r="3" fill="#1f2933"/><text class="n" x="27" y="10.1">4</text>
  <circle cx="31" cy="-6" r="0" fill="#1f2933"/>
</g>
<!-- the step list -->
<g>
 <circle cx="370" cy="48" r="11" fill="#1f2933"/><text class="nb" x="370" y="53">1</text>
 <text class="tb" x="390" y="46">Battery</text><text class="m" x="390" y="62">into the abdomen pocket, lead</text><text class="m" x="390" y="78">toward the thorax</text>
 <circle cx="370" cy="116" r="11" fill="#1f2933"/><text class="nb" x="370" y="121">2</text>
 <text class="tb" x="390" y="114">Carrier board</text><text class="m" x="390" y="130">onto the two posts, two M2 &#215; 4</text><text class="m" x="390" y="146">screws (an 8 mm one would come</text><text class="m" x="390" y="162">out of the back)</text>
 <circle cx="370" cy="190" r="11" fill="#1f2933"/><text class="nb" x="370" y="195">3</text>
 <text class="tb" x="390" y="188">Battery plug</text><text class="m" x="390" y="204">into the socket from the left edge.</text><text class="m" x="390" y="220">Red wire to the + on the board.</text>
 <circle cx="370" cy="248" r="11" fill="#1f2933"/><text class="nb" x="370" y="253">4</text>
 <text class="tb" x="390" y="246">Ribbons</text><text class="m" x="390" y="262">out of the top slots, a loop of</text><text class="m" x="390" y="278">slack inside, sleeve just outside</text>
 <circle cx="370" cy="306" r="11" fill="#1f2933"/><text class="nb" x="370" y="311">5</text>
 <text class="tb" x="390" y="304">Cover</text><text class="m" x="390" y="320">press the lip into the base until it</text><text class="m" x="390" y="336">clicks. Check no wire is pinched.</text>
 <circle cx="370" cy="364" r="11" fill="#1f2933"/><text class="nb" x="370" y="369">6</text>
 <text class="tb" x="390" y="362">Chain</text><text class="m" x="390" y="378">through the hole in the head</text><text class="m" x="390" y="394">(Step 14 does the cables).</text>
</g>
<text class="m" x="390" y="440">The switch lever pokes out of the</text><text class="m" x="390" y="456">top edge and USB-C out of the</text><text class="m" x="390" y="472">right edge, so you can charge and</text><text class="m" x="390" y="488">switch without opening it.</text>
</svg>
