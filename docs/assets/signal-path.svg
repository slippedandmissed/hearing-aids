<!-- From sound to bone, one ear. HAND-AUTHORED SOURCE. The waveforms are illustrative: the PDM row is a real first-order sigma-delta bit stream of the sine in row 1, but with far fewer bits per cycle than the real 1 MHz stream.
     Numbers from docs/manual/02_how_it_works.md and PLAN.md (16.129 kHz = 32 MHz / 31 / 64; the amplifier switches at about 300 kHz). Checked 2026-11-23. -->
