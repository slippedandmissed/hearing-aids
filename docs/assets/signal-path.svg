<rect width="640" height="640" fill="#fff"/>
<text x="14" y="30" class="tb">From sound to bone, for one ear</text>
<rect x="14" y="60" width="170" height="44" rx="4" fill="#f6f8fa" stroke="#d3d9df"/><g transform="translate(14,60)"><path d="M0.0 22.0 L1.4 20.2 L2.8 18.5 L4.2 16.7 L5.7 15.1 L7.1 13.5 L8.5 12.0 L9.9 10.6 L11.3 9.4 L12.8 8.2 L14.2 7.3 L15.6 6.5 L17.0 5.8 L18.4 5.4 L19.8 5.1 L21.2 5.0 L22.7 5.1 L24.1 5.4 L25.5 5.8 L26.9 6.5 L28.3 7.3 L29.8 8.2 L31.2 9.4 L32.6 10.6 L34.0 12.0 L35.4 13.5 L36.8 15.1 L38.2 16.7 L39.7 18.5 L41.1 20.2 L42.5 22.0 L43.9 23.8 L45.3 25.5 L46.8 27.3 L48.2 28.9 L49.6 30.5 L51.0 32.0 L52.4 33.4 L53.8 34.6 L55.2 35.8 L56.7 36.7 L58.1 37.5 L59.5 38.2 L60.9 38.6 L62.3 38.9 L63.8 39.0 L65.2 38.9 L66.6 38.6 L68.0 38.2 L69.4 37.5 L70.8 36.7 L72.2 35.8 L73.7 34.6 L75.1 33.4 L76.5 32.0 L77.9 30.5 L79.3 28.9 L80.8 27.3 L82.2 25.5 L83.6 23.8 L85.0 22.0 L86.4 20.2 L87.8 18.5 L89.2 16.7 L90.7 15.1 L92.1 13.5 L93.5 12.0 L94.9 10.6 L96.3 9.4 L97.8 8.2 L99.2 7.3 L100.6 6.5 L102.0 5.8 L103.4 5.4 L104.8 5.1 L106.2 5.0 L107.7 5.1 L109.1 5.4 L110.5 5.8 L111.9 6.5 L113.3 7.3 L114.8 8.2 L116.2 9.4 L117.6 10.6 L119.0 12.0 L120.4 13.5 L121.8 15.1 L123.2 16.7 L124.7 18.5 L126.1 20.2 L127.5 22.0 L128.9 23.8 L130.3 25.5 L131.8 27.3 L133.2 28.9 L134.6 30.5 L136.0 32.0 L137.4 33.4 L138.8 34.6 L140.2 35.8 L141.7 36.7 L143.1 37.5 L144.5 38.2 L145.9 38.6 L147.3 38.9 L148.8 39.0 L150.2 38.9 L151.6 38.6 L153.0 38.2 L154.4 37.5 L155.8 36.7 L157.2 35.8 L158.7 34.6 L160.1 33.4 L161.5 32.0 L162.9 30.5 L164.3 28.9 L165.8 27.3 L167.2 25.5 L168.6 23.8 L170.0 22.0" fill="none" stroke="#1f2933" stroke-width="2"/></g>
<circle cx="206" cy="74" r="11" fill="#1f2933"/><text class="nb" x="206" y="79">1</text><text class="tb" x="226" y="79">Sound</text>
<text class="m" x="226" y="98">Pressure waves in the air hit the microphone's</text>
<text class="m" x="226" y="113">membrane.</text>
<rect x="530" y="64" width="96" height="22" rx="11" fill="#6b7785"/><text class="chip" x="578" y="79">air</text>
<path d="M99 107 v22" stroke="#1f2933" stroke-width="2"/><path d="M93 124 l6 8 6 -8z" fill="#1f2933"/>
<rect x="14" y="160" width="170" height="44" rx="4" fill="#f6f8fa" stroke="#d3d9df"/><g transform="translate(14,160)"><path d="M0.5 6 v32M2.5 6 v32M4.5 6 v32M5.5 6 v32M7.5 6 v32M8.5 6 v32M9.5 6 v32M11.5 6 v32M12.5 6 v32M13.5 6 v32M14.5 6 v32M15.5 6 v32M16.5 6 v32M17.5 6 v32M18.5 6 v32M19.5 6 v32M20.5 6 v32M21.5 6 v32M22.5 6 v32M23.5 6 v32M24.5 6 v32M25.5 6 v32M26.5 6 v32M27.5 6 v32M28.5 6 v32M29.5 6 v32M30.5 6 v32M32.5 6 v32M33.5 6 v32M34.5 6 v32M35.5 6 v32M37.5 6 v32M38.5 6 v32M40.5 6 v32M41.5 6 v32M43.5 6 v32M46.5 6 v32M49.5 6 v32M54.5 6 v32M75.5 6 v32M79.5 6 v32M82.5 6 v32M84.5 6 v32M86.5 6 v32M88.5 6 v32M90.5 6 v32M91.5 6 v32M92.5 6 v32M94.5 6 v32M95.5 6 v32M96.5 6 v32M97.5 6 v32M98.5 6 v32M99.5 6 v32M101.5 6 v32M102.5 6 v32M103.5 6 v32M104.5 6 v32M105.5 6 v32M106.5 6 v32M107.5 6 v32M108.5 6 v32M109.5 6 v32M110.5 6 v32M111.5 6 v32M112.5 6 v32M113.5 6 v32M114.5 6 v32M115.5 6 v32M116.5 6 v32M117.5 6 v32M118.5 6 v32M120.5 6 v32M121.5 6 v32M122.5 6 v32M124.5 6 v32M126.5 6 v32M127.5 6 v32M130.5 6 v32M132.5 6 v32M136.5 6 v32M155.5 6 v32M162.5 6 v32M166.5 6 v32M168.5 6 v32" stroke="#2f8bd6" stroke-width="1" fill="none"/></g>
<circle cx="206" cy="174" r="11" fill="#1f2933"/><text class="nb" x="206" y="179">2</text><text class="tb" x="226" y="179">PDM bit stream</text>
<text class="m" x="226" y="198">The microphone chip turns that into single</text>
<text class="m" x="226" y="213">bits at about 1 MHz. More ones means more</text>
<text class="m" x="226" y="228">pressure.</text>
<rect x="530" y="164" width="96" height="22" rx="11" fill="#ff73b8"/><text class="chip" x="578" y="179">in the bear</text>
<path d="M99 207 v22" stroke="#1f2933" stroke-width="2"/><path d="M93 224 l6 8 6 -8z" fill="#1f2933"/>
<text class="m" x="112" y="226">PDM: 2 wires</text>
<rect x="14" y="260" width="170" height="44" rx="4" fill="#f6f8fa" stroke="#d3d9df"/><g transform="translate(14,260)"><path d="M0.0 17.9 H6.5 V10.7 H13.1 V6.1 H19.6 V5.1 H26.2 V8.0 H32.7 V14.1 H39.2 V22.0 H45.8 V29.9 H52.3 V36.0 H58.8 V38.9 H65.4 V37.9 H71.9 V33.3 H78.5 V26.1 H85.0 V17.9 H91.5 V10.7 H98.1 V6.1 H104.6 V5.1 H111.2 V8.0 H117.7 V14.1 H124.2 V22.0 H130.8 V29.9 H137.3 V36.0 H143.8 V38.9 H150.4 V37.9 H156.9 V33.3 H163.5 V26.1 H170.0" stroke="#1f2933" stroke-width="1.8" fill="none"/></g>
<circle cx="206" cy="274" r="11" fill="#1f2933"/><text class="nb" x="206" y="279">3</text><text class="tb" x="226" y="279">Numbers</text>
<text class="m" x="226" y="298">The XIAO averages 64 bits into one 16-bit</text>
<text class="m" x="226" y="313">sample, 16 129 times a second.</text>
<rect x="530" y="264" width="96" height="22" rx="11" fill="#f5c518"/><text class="chip" x="578" y="279">in the bee</text>
<path d="M99 307 v22" stroke="#1f2933" stroke-width="2"/><path d="M93 324 l6 8 6 -8z" fill="#1f2933"/>
