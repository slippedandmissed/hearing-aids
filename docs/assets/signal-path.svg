<circle cx="206" cy="374" r="11" fill="#1f2933"/><text class="nb" x="206" y="379">4</text><text class="tb" x="226" y="379">Processing</text>
<text class="m" x="226" y="398">Software shapes the sound: filter, gain,</text>
<text class="m" x="226" y="413">limiter. You can retune it without a soldering</text>
<text class="m" x="226" y="428">iron.</text>
<rect x="530" y="364" width="96" height="22" rx="11" fill="#f5c518"/><text class="chip" x="578" y="379">in the bee</text>
<path d="M99 407 v22" stroke="#1f2933" stroke-width="2"/><path d="M93 424 l6 8 6 -8z" fill="#1f2933"/>
<text class="m" x="112" y="426">I2S: 3 wires</text>
<rect x="14" y="460" width="170" height="44" rx="4" fill="#f6f8fa" stroke="#d3d9df"/><g transform="translate(14,460)"><path d="M0.0 36 V8 h2.9 V36 M5.0 36 V8 h3.6 V36 M10.0 36 V8 h4.1 V36 M15.0 36 V8 h4.4 V36 M20.0 36 V8 h4.5 V36 M25.0 36 V8 h4.3 V36 M30.0 36 V8 h3.8 V36 M35.0 36 V8 h3.2 V36 M40.0 36 V8 h2.5 V36 M45.0 36 V8 h1.8 V36 M50.0 36 V8 h1.2 V36 M55.0 36 V8 h0.7 V36 M60.0 36 V8 h0.5 V36 M65.0 36 V8 h0.6 V36 M70.0 36 V8 h0.9 V36 M75.0 36 V8 h1.4 V36 M80.0 36 V8 h2.1 V36 M85.0 36 V8 h2.9 V36 M90.0 36 V8 h3.6 V36 M95.0 36 V8 h4.1 V36 M100.0 36 V8 h4.4 V36 M105.0 36 V8 h4.5 V36 M110.0 36 V8 h4.3 V36 M115.0 36 V8 h3.8 V36 M120.0 36 V8 h3.2 V36 M125.0 36 V8 h2.5 V36 M130.0 36 V8 h1.8 V36 M135.0 36 V8 h1.2 V36 M140.0 36 V8 h0.7 V36 M145.0 36 V8 h0.5 V36 M150.0 36 V8 h0.6 V36 M155.0 36 V8 h0.9 V36 M160.0 36 V8 h1.4 V36 M165.0 36 V8 h2.1 V36 " stroke="#d64545" stroke-width="1.4" fill="none"/></g>
<circle cx="206" cy="474" r="11" fill="#1f2933"/><text class="nb" x="206" y="479">5</text><text class="tb" x="226" y="479">Class-D amplifier</text>
<text class="m" x="226" y="498">The numbers go over I2S to the amplifier,</text>
<text class="m" x="226" y="513">which switches a square wave about 300 000</text>
<text class="m" x="226" y="528">times a second and varies the width of each</text>
<text class="m" x="226" y="543">pulse.</text>
<rect x="530" y="464" width="96" height="22" rx="11" fill="#ff73b8"/><text class="chip" x="578" y="479">in the bear</text>
<path d="M99 507 v22" stroke="#1f2933" stroke-width="2"/><path d="M93 524 l6 8 6 -8z" fill="#1f2933"/>
<text class="m" x="112" y="526">2 wires + 44 Ω</text>
<rect x="14" y="560" width="170" height="44" rx="4" fill="#f6f8fa" stroke="#d3d9df"/><g transform="translate(14,560)"><path d="M0.0 22.0 L1.4 20.2 L2.8 18.5 L4.2 16.7 L5.7 15.1 L7.1 13.5 L8.5 12.0 L9.9 10.6 L11.3 9.4 L12.8 8.2 L14.2 7.3 L15.6 6.5 L17.0 5.8 L18.4 5.4 L19.8 5.1 L21.2 5.0 L22.7 5.1 L24.1 5.4 L25.5 5.8 L26.9 6.5 L28.3 7.3 L29.8 8.2 L31.2 9.4 L32.6 10.6 L34.0 12.0 L35.4 13.5 L36.8 15.1 L38.2 16.7 L39.7 18.5 L41.1 20.2 L42.5 22.0 L43.9 23.8 L45.3 25.5 L46.8 27.3 L48.2 28.9 L49.6 30.5 L51.0 32.0 L52.4 33.4 L53.8 34.6 L55.2 35.8 L56.7 36.7 L58.1 37.5 L59.5 38.2 L60.9 38.6 L62.3 38.9 L63.8 39.0 L65.2 38.9 L66.6 38.6 L68.0 38.2 L69.4 37.5 L70.8 36.7 L72.2 35.8 L73.7 34.6 L75.1 33.4 L76.5 32.0 L77.9 30.5 L79.3 28.9 L80.8 27.3 L82.2 25.5 L83.6 23.8 L85.0 22.0 L86.4 20.2 L87.8 18.5 L89.2 16.7 L90.7 15.1 L92.1 13.5 L93.5 12.0 L94.9 10.6 L96.3 9.4 L97.8 8.2 L99.2 7.3 L100.6 6.5 L102.0 5.8 L103.4 5.4 L104.8 5.1 L106.2 5.0 L107.7 5.1 L109.1 5.4 L110.5 5.8 L111.9 6.5 L113.3 7.3 L114.8 8.2 L116.2 9.4 L117.6 10.6 L119.0 12.0 L120.4 13.5 L121.8 15.1 L123.2 16.7 L124.7 18.5 L126.1 20.2 L127.5 22.0 L128.9 23.8 L130.3 25.5 L131.8 27.3 L133.2 28.9 L134.6 30.5 L136.0 32.0 L137.4 33.4 L138.8 34.6 L140.2 35.8 L141.7 36.7 L143.1 37.5 L144.5 38.2 L145.9 38.6 L147.3 38.9 L148.8 39.0 L150.2 38.9 L151.6 38.6 L153.0 38.2 L154.4 37.5 L155.8 36.7 L157.2 35.8 L158.7 34.6 L160.1 33.4 L161.5 32.0 L162.9 30.5 L164.3 28.9 L165.8 27.3 L167.2 25.5 L168.6 23.8 L170.0 22.0" fill="none" stroke="#1f2933" stroke-width="2"/></g>
<circle cx="206" cy="574" r="11" fill="#1f2933"/><text class="nb" x="206" y="579">6</text><text class="tb" x="226" y="579">Exciter</text>
<text class="m" x="226" y="598">The coil cannot follow 300 kHz, so it follows</text>
<text class="m" x="226" y="613">the average: the original sound, now as motion</text>
<text class="m" x="226" y="628">pressed into the bone.</text>
<rect x="530" y="564" width="96" height="22" rx="11" fill="#8a949e"/><text class="chip" x="578" y="579">behind the ear</text>
</svg>
