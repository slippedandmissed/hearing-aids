<line x1="100" y1="160" x2="113" y2="193" stroke="#1f2933" stroke-width="2"/>
<text x="86" y="184" font-size="12.5" text-anchor="end" fill="#1f2933" font-weight="700">S2</text>
<circle cx="300" cy="80" r="3.4" fill="#1f2933"/><circle cx="300" cy="120" r="3.4" fill="#fff" stroke="#1f2933" stroke-width="2"/>
