<text x="92" y="136" font-size="12.5" text-anchor="end" fill="#1f2933" font-weight="700">OUTP</text>
<text x="308" y="136" font-size="12.5" text-anchor="start" fill="#1f2933" font-weight="700">OUTN</text>
