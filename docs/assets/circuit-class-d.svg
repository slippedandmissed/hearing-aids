<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" width="640" height="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Class-D output stage of the amplifier U1 with the exciter, simplified (complementary pulse-width modulation). HAND-AUTHORED SOURCE; R_OUT1 / R_OUT2 are checked against the routed board by docs/check_circuits.py. 88 mA = 4.2 V / (22 + 4 + 22 ohm), the manual's worst-case square-wave figure. Checked 2026-11-23. -->
<rect width="640" height="610" fill="#fff"/>
<text x="14" y="22" font-size="14" text-anchor="start" fill="#1f2933" font-weight="700">Class-D output stage, U1 up close (simplified)</text>
