<text x="250" y="126" font-size="12.5" text-anchor="middle" fill="#1f2933">R_OUT2 22 Ω</text>
<polyline points="270,140 300,140" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
<polyline points="100,64 100,140 300,140 300,216" fill="none" stroke="#d64545" stroke-width="2.4" stroke-dasharray="6 5" opacity=".8"/>
<polygon points="114,134 124,140 114,146" fill="#d64545"/><polygon points="274,134 284,140 274,146" fill="#d64545"/><polygon points="94,100 100,110 106,100" fill="#d64545"/><polygon points="294,186 300,196 306,186" fill="#d64545"/>
<text x="350" y="96" font-size="12.5" text-anchor="start" fill="#1f2933" font-weight="700">State A: S1 and S4 are closed.</text>
<text x="350" y="113" font-size="12.5" text-anchor="start" fill="#1f2933">The current runs from VBAT through S1,</text>
<text x="350" y="130" font-size="12.5" text-anchor="start" fill="#1f2933">the first 22 Ω, the coil, the second</text>
<text x="350" y="147" font-size="12.5" text-anchor="start" fill="#1f2933">22 Ω and S4 to ground.</text>
<text x="350" y="164" font-size="12.5" text-anchor="start" fill="#1f2933"></text>
<text x="350" y="181" font-size="12.5" text-anchor="start" fill="#1f2933">Half a period later S3 and S2 close</text>
<text x="350" y="198" font-size="12.5" text-anchor="start" fill="#1f2933">and the current reverses.</text>
<line x1="14" y1="250" x2="626" y2="250" stroke="#d3d9df"/>
<text x="14" y="274" font-size="13" text-anchor="start" fill="#1f2933" font-weight="700">The three nodes over one cycle of the audio (the chip really makes far more pulses than are drawn)</text>
<text x="14" y="306" font-size="12.5" text-anchor="start" fill="#1f2933" font-weight="700">OUTP</text>
<text x="14" y="322" font-size="12" text-anchor="start" fill="#6b7785">0 or VBAT</text>
