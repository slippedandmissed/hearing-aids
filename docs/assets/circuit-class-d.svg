<text x="610" y="482" font-size="12.5" text-anchor="end" fill="#d64545" font-weight="700">the coil follows the average (dashed): the audio</text>
<text x="14" y="512" font-size="12.5" text-anchor="start" fill="#1f2933">Wide pulses to +VBAT push the coil one way and wide pulses to −VBAT the other; it cannot follow</text>
<text x="14" y="528" font-size="12.5" text-anchor="start" fill="#1f2933">the fast switching, so it follows the average. The load sits between two outputs that move in</text>
<text x="14" y="544" font-size="12.5" text-anchor="start" fill="#1f2933">opposition, so it can swing ±4.2 V: twice what one output could give. The two 22 Ω limit the</text>
<text x="14" y="560" font-size="12.5" text-anchor="start" fill="#1f2933">current, even for a full-scale square wave, to about 4.2 V ÷ (22 + 4 + 22 Ω) = 88 mA.</text>
<text x="14" y="576" font-size="12.5" text-anchor="start" fill="#6b7785">Simplified: the real chip's modulation is more refined, but the picture is the same.</text>
