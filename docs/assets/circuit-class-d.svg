<circle cx="100" cy="64" r="3.4" fill="#1f2933"/>
<circle cx="300" cy="64" r="3.4" fill="#1f2933"/>
<polyline points="100,64 100,80" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
<polyline points="100,120 100,160" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
