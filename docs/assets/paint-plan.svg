<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Paint and tape plan (Step 2). HAND-AUTHORED SOURCE. Shapes drawn in millimetres, Y up (bear 6 px/mm, bee 2.6 px/mm), from cad/gummy_dangle.py
     (head ellipse (0,13) 9.5 x 8.5, body ellipse (0,-2) 11.6 x 16, eye wells (+-3.4,14.5) r1.3, nose well (0,11.4) r1.8, belly-button dimple at the mic (2.6,-3.69) r2.0 with the sound port r0.7,
     hook loop block (0,22.4) 5 x 5 with a 2.2 mm hole) and cad/bee_box.py (thorax 62 x 46 centred, abdomen 44 wide, ridges at y -29/-38.5/-48, head r11 at y33, wings 33 x 16 at 42 deg from (+-27,12)).
     Checked 2026-11-23. The bee is a cartoon of the model, not a render. -->
<style>
 .t{font-size:14px;fill:#1f2933} .tb{font-size:14px;fill:#1f2933;font-weight:700} .m{font-size:12.5px;fill:#6b7785} .lead{stroke:#1f2933;stroke-width:1;fill:none}
 .nb{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
</style>
<rect width="640" height="560" fill="#fff"/>
<text x="14" y="22" class="tb">Left bear, front</text><text x="372" y="22" class="tb">Bee, assembled</text>
<g transform="translate(110,190) scale(6,-6)" stroke="#1f2933" stroke-width=".12">
  <ellipse cx="0" cy="-2" rx="11.6" ry="16" fill="#ff73b8"/><ellipse cx="0" cy="13" rx="9.5" ry="8.5" fill="#ff73b8"/>
  <rect x="-2.5" y="19.9" width="5" height="5" rx=".6" fill="#ff73b8"/><circle cx="0" cy="22.4" r="1.1" fill="#fff"/>
  <circle cx="-3.4" cy="14.5" r="1.3" fill="#1f2933"/><circle cx="3.4" cy="14.5" r="1.3" fill="#1f2933"/><circle cx="0" cy="11.4" r="1.8" fill="#1f2933"/>
  <circle cx="2.6" cy="-3.69" r="2" fill="#ffb3d6"/><circle cx="2.6" cy="-3.69" r=".7" fill="#fff"/>
  <g fill="#f1e2b8" fill-opacity=".9" stroke="#8a6d1f" stroke-dasharray=".5 .4" stroke-width=".15"><circle cx="2.6" cy="-3.69" r="2.6"/><circle cx="0" cy="22.4" r="1.9"/></g>
</g>
<g transform="translate(470,175) scale(2.6,-2.6)" stroke="#1f2933" stroke-width=".3">
  <ellipse cx="38" cy="24.3" rx="8" ry="16.5" fill="#c9d1d9" transform="rotate(-42 38 24.3)"/><ellipse cx="-38" cy="24.3" rx="8" ry="16.5" fill="#c9d1d9" transform="rotate(42 -38 24.3)"/>
  <path d="M-4 42 C-8 50 -12 52 -15 52 M4 42 C8 50 12 52 15 52" fill="none" stroke="#2a2f35" stroke-width="1.1"/>
  <circle cx="0" cy="33" r="11" fill="#2a2f35"/><circle cx="-4.2" cy="34.5" r="1.6" fill="#fff" stroke="none"/><circle cx="4.2" cy="34.5" r="1.6" fill="#fff" stroke="none"/>
  <path d="M-4.5 -56 L0 -65 L4.5 -56 Z" fill="#2a2f35"/>
  <rect x="-22" y="-56" width="44" height="36" rx="9" fill="#2a2f35"/>
  <rect x="-21" y="-32.75" width="42" height="7.5" rx="3.7" fill="#f5c518" stroke="none"/><rect x="-21" y="-42.25" width="42" height="7.5" rx="3.7" fill="#f5c518" stroke="none"/><rect x="-21" y="-51.75" width="42" height="7.5" rx="3.7" fill="#f5c518" stroke="none"/>
  <rect x="-31" y="-23" width="62" height="46" rx="5" fill="#f5c518"/>
</g>
<!-- badges -->
<g class="lead"><path d="M178 108 L132 103"/><path d="M178 212 L132 212"/><path d="M156 56 L119 56"/><path d="M526 88 L500 88"/><path d="M536 262 L505 262"/></g>
<g>
 <circle cx="190" cy="108" r="11" fill="#1f2933"/><text class="nb" x="190" y="113">1</text>
 <circle cx="190" cy="212" r="11" fill="#1f2933"/><text class="nb" x="190" y="217">2</text>
 <circle cx="168" cy="56" r="11" fill="#1f2933"/><text class="nb" x="168" y="61">3</text>
 <circle cx="70" cy="250" r="11" fill="#1f2933"/><text class="nb" x="70" y="255">4</text>
 <circle cx="572" cy="112" r="11" fill="#1f2933"/><text class="nb" x="572" y="117">5</text>
 <circle cx="470" cy="190" r="11" fill="#1f2933"/><text class="nb" x="470" y="195">6</text>
 <circle cx="548" cy="262" r="11" fill="#1f2933"/><text class="nb" x="548" y="267">7</text>
 <circle cx="538" cy="88" r="11" fill="#1f2933"/><text class="nb" x="538" y="93">8</text>
</g>
<!-- legend -->
<line x1="14" y1="366" x2="626" y2="366" stroke="#d3d9df"/>
<g>
 <text class="t" x="14" y="392"><tspan font-weight="700">1</tspan>  Black: eye wells and nose well</text>
 <text class="t" x="14" y="414"><tspan font-weight="700">2</tspan>  Tape over the sound port (belly button)</text>
 <text class="t" x="14" y="436"><tspan font-weight="700">3</tspan>  Tape or a toothpick in the 2.2 mm loop hole</text>
 <text class="t" x="14" y="458"><tspan font-weight="700">4</tspan>  Pink (left) or blue (right) on gesso</text>
 <text class="t" x="338" y="392"><tspan font-weight="700">5</tspan>  Silver: wings (on the base)</text>
 <text class="t" x="338" y="414"><tspan font-weight="700">6</tspan>  Yellow: cover and bumps</text>
 <text class="t" x="338" y="436"><tspan font-weight="700">7</tspan>  Black: paint into the grooves</text>
 <text class="t" x="338" y="458"><tspan font-weight="700">8</tspan>  Head, antennae, stinger: no paint</text>
</g>
<g fill="#f1e2b8" stroke="#8a6d1f" stroke-dasharray="4 3"><rect x="14" y="480" width="26" height="14"/></g><text class="m" x="50" y="492">painter's tape or a plug. Also tape the four screw holes on each back plate.</text>
<text class="m" x="14" y="520">Not painted: clips and arms (paint cracks where they flex). The bee's eye wells take a dot of white if you like.</text>
<text class="m" x="14" y="540">Order: sand, tape the holes, gesso, base colours, details, pull the tape.</text>
</svg>
