<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Dangle (earring) PCB solder map, COMPONENT side up. HAND-AUTHORED SOURCE. Board drawn in millimetres (16 px per mm), origin = board top-left,
     coordinates from pcb/build_dangle.py (checked 2026-11-23): exciter pads (3.5,1.4) and (9.5,1.4); cable pads row A y=23.8, row B y=25.9, cable arrives from the bottom edge (y=28).
     Ribbon A is the FAR row, so its wires pass between the row-B pads: A first, then B (the reverse of the carrier). -->
<style>
 .t{font-size:14px;fill:#1f2933} .tb{font-size:14px;fill:#1f2933;font-weight:700} .m{font-size:12.5px;fill:#6b7785}
 .board{fill:#dcefe3;stroke:#2e7d5b;stroke-width:.14}
 .smd{fill:#b8c0c8;stroke:#6b7785;stroke-width:.06}
 .pa{fill:#2f8bd6;stroke:#1f2933;stroke-width:.08} .pb{fill:#f08a24;stroke:#1f2933;stroke-width:.08} .pe{fill:#fff;stroke:#1f2933;stroke-width:.12}
 .pn{font-size:.85px;fill:#fff;font-weight:700;text-anchor:middle;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
 .g{font-size:.95px;fill:#1f2933;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
 .badge{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
</style>
<rect width="640" height="660" fill="#fff"/>
<text x="14" y="22" class="tb">Dangle PCB, component side up (the bare face with the big letter is underneath)</text>
<g transform="translate(46,92) scale(16)">
  <!-- wires: exciter up, ribbons from below -->
  <path d="M3.5 1.4 V-3.2" stroke="#1f2933" stroke-width=".6" fill="none" stroke-linecap="round"/><path d="M9.5 1.4 V-3.2" stroke="#d64545" stroke-width=".6" fill="none" stroke-linecap="round"/>
  <g stroke="#2f8bd6" stroke-width=".62" fill="none" stroke-linecap="round"><path d="M1.9 35 V23.8"/><path d="M4.6 35 V23.8"/><path d="M7.3 35 V23.8"/><path d="M10 35 V23.8"/></g>
  <g stroke="#f08a24" stroke-width=".62" fill="none" stroke-linecap="round"><path d="M3.25 35 V25.9"/><path d="M5.95 35 V25.9"/><path d="M8.65 35 V25.9"/><path d="M11.3 35 V25.9"/></g>
  <rect class="board" x="0" y="0" width="13" height="28" rx="1" ry="1"/>
  <!-- parts fitted by JLCPCB -->
  <g class="smd">
    <rect x="1.9" y="4.6" width="3.2" height="1.6"/><rect x="7.9" y="4.6" width="3.2" height="1.6"/>
    <rect x="5" y="8.3" width="3" height="3"/><rect x="9.5" y="8" width="1.6" height=".8"/><rect x="9.6" y="10" width="2" height="1.25"/>
    <rect x="5.2" y="12.8" width=".8" height="1.6"/><rect x="7.8" y="12.8" width=".8" height="1.6"/><rect x="11.5" y="15.5" width=".8" height="1.6"/><rect x="1.3" y="10.2" width=".8" height="1.6"/>
    <rect x="8.7" y="17.3" width="3" height="2.6"/><rect x="7.2" y="20.4" width="1.6" height=".8"/><rect x="2.15" y="17.65" width="3.5" height="2.7"/>
  </g>
  <circle cx="3.9" cy="19" r=".45" fill="#fff" stroke="#1f2933" stroke-width=".1" stroke-dasharray=".25 .2"/>
  <text class="g" x="6.5" y="15.5" text-anchor="middle" fill="#4a5561" style="font-size:.8px">amp</text>
  <text class="g" x="3.9" y="21.5" text-anchor="middle" style="font-size:.8px;fill:#4a5561">mic</text>
  <!-- pads -->
  <circle class="pe" cx="3.5" cy="1.4" r=".75"/><circle class="pe" cx="9.5" cy="1.4" r=".75"/>
  <g class="pa"><circle cx="1.9" cy="23.8" r=".75"/><circle cx="4.6" cy="23.8" r=".75"/><circle cx="7.3" cy="23.8" r=".75"/><circle cx="10" cy="23.8" r=".75"/></g>
  <g class="pb"><circle cx="3.25" cy="25.9" r=".75"/><circle cx="5.95" cy="25.9" r=".75"/><circle cx="8.65" cy="25.9" r=".75"/><circle cx="11.3" cy="25.9" r=".75"/></g>
  <g class="pn"><text x="1.9" y="24.1">1</text><text x="4.6" y="24.1">2</text><text x="7.3" y="24.1">3</text><text x="10" y="24.1">4</text><text x="3.25" y="26.2">5</text><text x="5.95" y="26.2">6</text><text x="8.65" y="26.2">7</text><text x="11.3" y="26.2">8</text></g>
  <!-- heat-shrink sleeve over the pair, below the board -->
  <rect x="0.9" y="31" width="11.2" height="2.6" rx=".5" fill="#3a3f45" opacity=".85"/>
</g>
<!-- labels on the board side -->
<text class="tb" x="92" y="90" text-anchor="end">EXC&#8722;</text><text class="tb" x="208" y="90" style="fill:#d64545">EXC+</text>
<g fill="#1f2933"><circle cx="14" cy="70" r="0"/></g>

<!-- right column: order of work -->
<g>
 <circle cx="282" cy="108" r="11" fill="#1f2933"/><text class="badge" x="282" y="113">1</text>
 <text class="tb" x="302" y="106">Sleeve on first</text><text class="m" x="302" y="122">15 mm of 3 mm heat-shrink over each</text><text class="m" x="302" y="138">ribbon pair, parked well back</text>
 <circle cx="282" cy="176" r="11" fill="#1f2933"/><text class="badge" x="282" y="181">2</text>
 <text class="tb" x="302" y="174">Ribbon A (blue)</text><text class="m" x="302" y="190">into the far row, between the B pads.</text><text class="m" x="302" y="206">Tight: do it before B is in the way.</text>
 <circle cx="282" cy="244" r="11" fill="#1f2933"/><text class="badge" x="282" y="249">3</text>
 <text class="tb" x="302" y="242">Ribbon B (orange)</text><text class="m" x="302" y="258">into the near row.</text>
 <circle cx="282" cy="296" r="11" fill="#1f2933"/><text class="badge" x="282" y="301">4</text>
 <text class="tb" x="302" y="294">Exciter wires</text><text class="m" x="302" y="310">about 5 cm; seen from this side,</text><text class="m" x="302" y="326">EXC+ is the right pad, EXC&#8722; the left.</text>
 <circle cx="282" cy="366" r="11" fill="#1f2933"/><text class="badge" x="282" y="371">5</text>
 <text class="tb" x="302" y="364">Shrink the sleeve</text><text class="m" x="302" y="380">about 20 mm below the board, so A</text><text class="m" x="302" y="396">and B leave as one cable.</text>
</g>
<line x1="270" y1="418" x2="626" y2="418" stroke="#d3d9df"/>
<text class="tb" x="282" y="442">Pad, signal, wire</text>
<g class="t" font-size="13">
 <text x="282" y="466" fill="#2f8bd6" style="fill:#2f8bd6;font-weight:700">A</text><text x="300" y="466">1 LRCLK &#183; 2 DIN &#183; 3 VBAT &#183; 4 PDM_DATA</text>
 <text x="282" y="488" fill="#f08a24" style="fill:#c46a0a;font-weight:700">B</text><text x="300" y="488">5 BCLK &#183; 6 GND &#183; 7 PDM_CLK &#183; 8 GND</text>
</g>
<text class="m" x="282" y="516">Same wire position at both ends of</text><text class="m" x="282" y="532">every ribbon, so the harness is 1:1.</text>
<text class="m" x="282" y="560">Wires go in from the component side,</text><text class="m" x="282" y="576">are soldered there, and are trimmed flush:</text><text class="m" x="282" y="592">the bare face must stay flat.</text>
<rect x="282" y="608" width="22" height="12" fill="#b8c0c8" stroke="#6b7785"/><text class="m" x="312" y="618">already fitted by JLCPCB</text>
</svg>
