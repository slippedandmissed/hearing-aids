<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Carrier PCB solder map. HAND-AUTHORED SOURCE (edit freely). Board drawn in millimetres inside the scaled group:
     origin = board top-left, +x right, +y down, 8 px per mm. Pad positions copied from pcb/carrier/build_carrier.py (checked against carrier_C_final, 2026-11-23).
     Step colours: 1 orange, 2 blue, 3 violet, 4 teal, 5 pink (same palette in every assembly diagram, see docs/assets/README.md). -->
<style>
 .t{font-size:13px;fill:#1f2933} .tb{font-size:13px;fill:#1f2933;font-weight:700} .m{font-size:12px;fill:#6b7785}
 .board{fill:#dcefe3;stroke:#2e7d5b;stroke-width:.3}
 .smd{fill:#b8c0c8;stroke:#6b7785;stroke-width:.1}
 .p1{fill:#f08a24;stroke:#1f2933;stroke-width:.12} .p2{fill:#2f8bd6;stroke:#1f2933;stroke-width:.12}
 .p3{fill:#7a5fd0;stroke:#1f2933;stroke-width:.12} .p4{fill:#17a2a2;stroke:#1f2933;stroke-width:.12}
 .g{font-size:1.5px;fill:#1f2933;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
 .gm{font-size:1.3px;fill:#4a5561;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
 .n{font-size:1.9px;fill:#fff;font-weight:700;text-anchor:middle;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
 .nb{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
 .wire{fill:none;stroke-width:.35;stroke-linecap:round}
</style>
<rect width="640" height="650" fill="#fff"/>
<text x="14" y="20" class="tb">Carrier board, seen from the top (the side the XIAO sits on)</text>

<g transform="translate(14,46) scale(8)">
  <rect class="board" x="0" y="0" width="56" height="40" rx="9" ry="9"/>
  <!-- mounting holes -->
  <circle cx="2.6" cy="20" r="1.1" fill="#fff" stroke="#2e7d5b" stroke-width=".2"/><circle cx="53.4" cy="20" r="1.1" fill="#fff" stroke="#2e7d5b" stroke-width=".2"/>
  <!-- parts fitted by JLCPCB -->
  <g class="smd">
    <rect x="15.1" y="8.6" width="1.8" height="1" /><rect x="15.1" y="10.4" width="1.8" height="1"/><rect x="15.1" y="12.2" width="1.8" height="1"/><rect x="15.1" y="14" width="1.8" height="1"/><rect x="15.1" y="15.8" width="1.8" height="1"/>
    <rect x="43.1" y="8.6" width="1.8" height="1" /><rect x="43.1" y="10.4" width="1.8" height="1"/><rect x="43.1" y="12.2" width="1.8" height="1"/><rect x="43.1" y="14" width="1.8" height="1"/><rect x="43.1" y="15.8" width="1.8" height="1"/>
    <rect x="13.9" y="33.7" width="3.2" height="2.6"/><rect x="31.8" y="34.1" width="4.4" height="1.8"/><rect x="39.4" y="34.2" width="3.2" height="1.6"/><rect x="44.4" y="34.5" width="2.2" height="1"/>
    <rect x="49.5" y="30.9" width="1" height="2.2"/><rect x="49.5" y="34.9" width="1" height="2.2" fill="#e08a8a"/>
  </g>
  <!-- XIAO -->
  <rect x="19.5" y="12.1" width="21" height="17.8" rx=".8" fill="#e8eef5" stroke="#1f2933" stroke-width=".2"/>
  <rect x="38.6" y="18.3" width="1.9" height="5.4" fill="#c9d1d9" stroke="#1f2933" stroke-width=".12"/>
  <text class="g" x="29.2" y="20.5" text-anchor="middle">XIAO nRF52840</text><text class="gm" x="29.2" y="22.4" text-anchor="middle">pins down into the holes</text>
  <text class="gm" x="41.2" y="21.3">USB-C</text>
  <!-- step 2: 14 XIAO pin holes -->
  <g class="p2">
    <circle cx="22.38" cy="13.38" r=".62"/><circle cx="24.92" cy="13.38" r=".62"/><circle cx="27.46" cy="13.38" r=".62"/><circle cx="30" cy="13.38" r=".62"/><circle cx="32.54" cy="13.38" r=".62"/><circle cx="35.08" cy="13.38" r=".62"/><circle cx="37.62" cy="13.38" r=".62"/>
    <circle cx="22.38" cy="28.62" r=".62"/><circle cx="24.92" cy="28.62" r=".62"/><circle cx="27.46" cy="28.62" r=".62"/><circle cx="30" cy="28.62" r=".62"/><circle cx="32.54" cy="28.62" r=".62"/><circle cx="35.08" cy="28.62" r=".62"/><circle cx="37.62" cy="28.62" r=".62"/>
  </g>
  <!-- step 1/2: battery wires from the XIAO back pads -->
  <path class="wire" stroke="#d64545" d="M19.6 19.2 C18.6 19.2 18 19 16.6 19"/><path class="wire" stroke="#1f2933" d="M19.6 20.8 C18.6 20.8 18 21 16.6 21"/>
  <circle class="p1" cx="16.6" cy="19" r=".8"/><circle class="p1" cx="16.6" cy="21" r=".8"/>
  <text class="g" x="15.4" y="19.5" text-anchor="end">B+</text><text class="g" x="15.4" y="21.5" text-anchor="end">B&#8722;</text>
  <!-- step 3: battery socket (plug enters from the left edge) and switch -->
  <rect x="4" y="29" width="8.4" height="6" rx=".5" fill="#f4f1ea" stroke="#1f2933" stroke-width=".2"/>
  <text class="g" x="5" y="31.7">+</text><text class="g" x="5" y="33.8">&#8722;</text><text class="gm" x="8.2" y="37.5" text-anchor="middle">battery socket</text>
  <path d="M3.4 32 L0.4 32" stroke="#7a5fd0" stroke-width=".3" marker-end="none"/><path d="M1.6 31.2 L0.4 32 L1.6 32.8" fill="none" stroke="#7a5fd0" stroke-width=".3"/>
  <circle class="p3" cx="11" cy="31" r=".62"/><circle class="p3" cx="11" cy="33" r=".62"/>
  <rect x="15.15" y="1.6" width="8.7" height="4.4" fill="#f4f1ea" stroke="#1f2933" stroke-width=".2"/>
  <rect x="18.5" y="-1.9" width="2" height="3.5" fill="#8a949e" stroke="#1f2933" stroke-width=".15"/>
  <g class="p3"><circle cx="17.5" cy="3.8" r=".62"/><circle cx="19.5" cy="3.8" r=".62"/><circle cx="21.5" cy="3.8" r=".62"/><rect x="14.85" y="3.1" width="1.0" height="1.4"/><rect x="23.15" y="3.1" width="1.0" height="1.4"/></g>
  <text class="gm" x="19.5" y="8" text-anchor="middle">switch</text>
  <!-- step 4: ear pad blocks -->
  <g class="p4">
    <circle cx="3.9" cy="3.8" r=".62"/><circle cx="6.6" cy="3.8" r=".62"/><circle cx="9.3" cy="3.8" r=".62"/><circle cx="12" cy="3.8" r=".62"/><circle cx="5.25" cy="6.3" r=".62"/><circle cx="7.95" cy="6.3" r=".62"/><circle cx="10.65" cy="6.3" r=".62"/><circle cx="13.35" cy="6.3" r=".62"/>
    <circle cx="42.65" cy="3.8" r=".62"/><circle cx="45.35" cy="3.8" r=".62"/><circle cx="48.05" cy="3.8" r=".62"/><circle cx="50.75" cy="3.8" r=".62"/><circle cx="44" cy="6.3" r=".62"/><circle cx="46.7" cy="6.3" r=".62"/><circle cx="49.4" cy="6.3" r=".62"/><circle cx="52.1" cy="6.3" r=".62"/>
  </g>
  <text class="g" x="8.6" y="10.4" text-anchor="middle" font-weight="700">left ear</text><text class="g" x="49.6" y="10.4" text-anchor="middle" font-weight="700">right ear</text>
  <!-- callouts -->
  <g>
    <circle cx="12.2" cy="20" r="1.35" fill="#f08a24"/><text class="n" x="12.2" y="20.7">1</text>
    <circle cx="30" cy="10" r="1.35" fill="#2f8bd6"/><text class="n" x="30" y="10.7">2</text>
    <circle cx="8" cy="27" r="1.35" fill="#7a5fd0"/><text class="n" x="8" y="27.7">3</text>
    <circle cx="27" cy="3.8" r="1.35" fill="#7a5fd0"/><text class="n" x="27" y="4.5">3</text>
    <circle cx="8.6" cy="13" r="1.35" fill="#17a2a2"/><text class="n" x="8.6" y="13.7">4</text>
    <circle cx="49.6" cy="13" r="1.35" fill="#17a2a2"/><text class="n" x="49.6" y="13.7">4</text>
  </g>
</g>

<!-- legend -->
<g>
 <circle cx="484" cy="60" r="10" fill="#f08a24"/><text class="nb" x="484" y="65">1</text>
 <text class="t" x="502" y="58">Battery wires,</text><text class="t" x="502" y="74">B+ red, B&#8722; black</text><text class="m" x="502" y="90">soldered to the XIAO</text><text class="m" x="502" y="104">back first</text>
 <circle cx="484" cy="132" r="10" fill="#2f8bd6"/><text class="nb" x="484" y="137">2</text>
 <text class="t" x="502" y="130">XIAO: 14 pins,</text><text class="t" x="502" y="146">USB-C to the right</text>
 <circle cx="484" cy="190" r="10" fill="#7a5fd0"/><text class="nb" x="484" y="195">3</text>
 <text class="t" x="502" y="188">Battery socket</text><text class="t" x="502" y="204">and switch</text><text class="m" x="502" y="220">5 pads: 3 pins + 2 tabs</text>
 <circle cx="484" cy="248" r="10" fill="#17a2a2"/><text class="nb" x="484" y="253">4</text>
 <text class="t" x="502" y="246">Ear ribbons</text><text class="m" x="502" y="262">row B first, then A</text><text class="m" x="502" y="276">(below)</text>
 <rect x="474" y="298" width="20" height="12" fill="#b8c0c8" stroke="#6b7785"/><text class="t" x="502" y="308">Already fitted</text><text class="m" x="502" y="324">by JLCPCB</text>
</g>

<!-- ear block close-up -->
<text x="14" y="396" class="tb">Ear pad block: the same for both ears, 8 pads = 8 ribbon wires</text>
<rect x="14" y="410" width="14" height="8" fill="#2f8bd6"/><text class="t" x="34" y="418">ribbon A, wires 1&#8211;4</text>
<rect x="196" y="410" width="14" height="8" fill="#f08a24"/><text class="t" x="216" y="418">ribbon B, wires 5&#8211;8</text>
<circle cx="392" cy="414" r="6" fill="#d64545"/><text class="t" x="404" y="418">marked wire 1</text>
<g stroke-linecap="round">
 <g stroke="#f08a24" stroke-width="5" fill="none"><path d="M154 470 V580"/><path d="M262 470 V580"/><path d="M370 470 V580"/><path d="M478 470 V580"/></g>
 <g stroke="#2f8bd6" stroke-width="5" fill="none"><path d="M100 452 V520"/><path d="M208 452 V520"/><path d="M316 452 V520"/><path d="M424 452 V520"/></g>
 <circle cx="100" cy="452" r="6" fill="#d64545"/><circle cx="154" cy="470" r="6" fill="#d64545"/>
 <g fill="#17a2a2" stroke="#1f2933" stroke-width="1.5">
  <circle cx="100" cy="520" r="17"/><circle cx="208" cy="520" r="17"/><circle cx="316" cy="520" r="17"/><circle cx="424" cy="520" r="17"/>
  <circle cx="154" cy="580" r="17"/><circle cx="262" cy="580" r="17"/><circle cx="370" cy="580" r="17"/><circle cx="478" cy="580" r="17"/>
 </g>
 <g class="nb"><text x="100" y="525">1</text><text x="208" y="525">2</text><text x="316" y="525">3</text><text x="424" y="525">4</text><text x="154" y="585">5</text><text x="262" y="585">6</text><text x="370" y="585">7</text><text x="478" y="585">8</text></g>
 <g text-anchor="middle" font-size="12" fill="#1f2933"><text x="100" y="438">LRCLK</text><text x="208" y="438">DIN</text><text x="316" y="438">VBAT</text><text x="424" y="438">PDM_DATA</text></g>
 <g text-anchor="middle" font-size="12" fill="#1f2933"><text x="154" y="462">BCLK</text><text x="262" y="462">GND</text><text x="370" y="462">PDM_CLK</text><text x="478" y="462">GND</text></g>
</g>
<text class="m" x="14" y="622">B wires drop through the gaps between the A pads: solder B first, then A.</text>
<text class="m" x="14" y="638">Insert from the top, solder from the top, trim the tail flush underneath.</text>
</svg>
