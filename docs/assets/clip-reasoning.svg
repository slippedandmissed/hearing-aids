<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Why the clip is a spring-jaw clip: five problems, each forcing one feature. HAND-AUTHORED SOURCE. Numbers from PLAN.md and docs/manual/04_mechanical.md (ESTIMATES from the stem model, nothing tested on glasses):
     pad about 45 mm from a 14 mm clip; 0.25 mm slack per side rocks the clip about 2 degrees = about 1.6 mm at the pad (of a 5 mm preload); stem 7.0 -> 9.2 mm tall within +-7 mm of the clip,
     faces twist about 5 degrees over 14 mm, 41 degree bend between 100 and 127 mm; stem 3.54 mm thick; grips N 3.2-4.2 mm and T 2.9-3.9 mm; arms 2.4 / 2.8 / 3.2 mm. Checked 2026-11-23. -->
<style>
 .t{font-size:14px;fill:#1f2933} .tb{font-size:14px;fill:#1f2933;font-weight:700} .m{font-size:12.5px;fill:#6b7785} .p{font-size:12.5px;fill:#b3402a;font-weight:700} .s{font-size:12.5px;fill:#1f7a4d;font-weight:700}
 .nb{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle} .ink{stroke:#1f2933;fill:none;stroke-width:3;stroke-linecap:round}
</style>
<rect width="640" height="830" fill="#fff"/>
<text x="14" y="22" class="tb">Five problems that lead to this clip</text>

<!-- row 1 -->
<g transform="translate(0,34)">
 <circle cx="26" cy="22" r="11" fill="#1f2933"/><text class="nb" x="26" y="27">1</text>
 <rect x="50" y="0" width="190" height="128" rx="6" fill="#f6f8fa" stroke="#d3d9df"/>
 <path d="M70 40 H170 C196 40 214 52 220 78" class="ink"/><rect x="204" y="52" width="10" height="16" rx="2" fill="#1f2933"/>
 <path d="M214 68 C226 82 228 96 220 110" class="ink" stroke-width="4"/>
 <rect x="206" y="104" width="22" height="18" rx="3" fill="#8a949e" stroke="#1f2933" stroke-width="1.5"/>
 <path d="M96 80 V120 C96 124 100 126 104 126 H190" fill="none" stroke="#e8d3c0" stroke-width="12" opacity="0"/>
 <path d="M250 112 H234" stroke="#d64545" stroke-width="0"/>
 <text class="m" x="60" y="118">stem</text>
 <text class="p" x="262" y="18">PROBLEM</text><text class="t" x="262" y="38">Hold an exciter against the bone</text><text class="t" x="262" y="56">behind the ear for hours, with</text><text class="t" x="262" y="74">nothing but your glasses.</text>
 <text class="s" x="262" y="98">SO</text><text class="t" x="262" y="116">A thin spring arm hangs from the</text><text class="t" x="262" y="134">stem and presses the pad, 2&#8211;5 N.</text>
</g>
<!-- row 2 -->
<g transform="translate(0,200)">
 <circle cx="26" cy="22" r="11" fill="#1f2933"/><text class="nb" x="26" y="27">2</text>
 <rect x="50" y="0" width="190" height="128" rx="6" fill="#f6f8fa" stroke="#d3d9df"/>
 <path d="M60 22 H230" class="ink" stroke-width="3"/><rect x="132" y="14" width="28" height="16" rx="2" fill="#1f2933"/>
 <path d="M146 30 V112" class="ink" stroke="#1f2933" stroke-width="4"/>
 <path d="M146 30 L133 112" stroke="#d64545" stroke-width="3" stroke-dasharray="4 3" fill="none"/>
 <rect x="122" y="108" width="22" height="12" fill="#8a949e" stroke="#1f2933" stroke-width="1.2"/>
 <g stroke="#6b7785" stroke-width="1" fill="none"><path d="M96 34 H132 M96 28 v12 M132 28 v12"/><path d="M196 30 V112 M190 30 h12 M190 112 h12"/></g>
 <text class="m" x="100" y="52" text-anchor="middle">14</text><text class="m" x="224" y="76">45</text>
 <text class="m" x="60" y="100">small slack,</text><text class="m" x="60" y="116">big move</text>
 <text class="p" x="262" y="18">PROBLEM</text><text class="t" x="262" y="38">The pad is 45 mm from a 14 mm</text><text class="t" x="262" y="56">clip: a lever of about 3. Slack of</text><text class="t" x="262" y="74">0.25 mm a side loses 1.6 mm of</text><text class="t" x="262" y="92">the 5 mm preload.</text>
 <text class="s" x="262" y="114">SO</text><text class="t" x="262" y="132">The clip must have no slack: grip</text><text class="t" x="262" y="150">with spring force, not an exact fit.</text>
</g>
<!-- row 3 -->
<g transform="translate(0,366)">
 <circle cx="26" cy="22" r="11" fill="#1f2933"/><text class="nb" x="26" y="27">3</text>
 <rect x="50" y="0" width="190" height="128" rx="6" fill="#f6f8fa" stroke="#d3d9df"/>
 <path d="M64 56 H110 L160 50 L206 44 L206 78 L160 74 L110 78 L64 76 Z" fill="#e8d3c0" stroke="#1f2933" stroke-width="1.6"/>
 <path d="M206 61 C226 61 234 76 234 100" class="ink" stroke-width="5"/>
 <g stroke="#d64545" stroke-width="2"><path d="M138 44 L146 84"/><path d="M168 42 L170 84"/></g>
 <text class="m" x="64" y="104">tapers 7.0 &#8594; 9.2 mm</text><text class="m" x="64" y="120">faces twist 5&#176;</text><text class="m" x="64" y="28">bends 41&#176; just ahead</text>
 <text class="p" x="262" y="18">PROBLEM</text><text class="t" x="262" y="38">The stem is not a clean bar: it</text><text class="t" x="262" y="56">tapers, twists and bends, and you</text><text class="t" x="262" y="74">cannot measure it to 0.1 mm.</text>
 <text class="s" x="262" y="98">SO</text><text class="t" x="262" y="116">V-shaped jaws that wedge on the</text><text class="t" x="262" y="134">thickness (3.2&#8211;4.2 mm), in fingers</text><text class="t" x="262" y="152">that each follow the twist.</text>
</g>
<!-- row 4 -->
<g transform="translate(0,532)">
 <circle cx="26" cy="22" r="11" fill="#1f2933"/><text class="nb" x="26" y="27">4</text>
 <rect x="50" y="0" width="190" height="128" rx="6" fill="#f6f8fa" stroke="#d3d9df"/>
 <g transform="translate(108,14) scale(9)" stroke="#1f2933" stroke-width=".11">
  <path d="M0 0 H3.85 V1.6 L3.35 9.4 H2.2 L1.75 8.2 L2.45 1.6 H0 Z M0 0 H-3.85 V1.6 L-3.35 9.4 H-2.2 L-1.75 8.2 L-2.45 1.6 H0 Z" fill="#ff9d3c"/>
  <rect x="3.85" y="0" width="4.2" height="1.6" fill="#ff9d3c"/><path d="M8.05 .8 C10 .8 10.6 3 10.6 6" fill="none" stroke="#1f2933" stroke-width=".5"/>
 </g>
 <text class="m" x="196" y="96">shelf</text><path d="M200 84 L200 62" stroke="#6b7785" stroke-width="1" fill="none"/>
 <text class="p" x="262" y="18">PROBLEM</text><text class="t" x="262" y="38">If the arm is fused to a jaw, that</text><text class="t" x="262" y="56">jaw goes stiff and the other has</text><text class="t" x="262" y="74">to take all the spring travel.</text>
 <text class="s" x="262" y="98">SO</text><text class="t" x="262" y="116">The arm hangs from a rigid shelf</text><text class="t" x="262" y="134">on the top plate, clear of both jaws.</text>
</g>
<!-- row 5 -->
<g transform="translate(0,698)">
 <circle cx="26" cy="22" r="11" fill="#1f2933"/><text class="nb" x="26" y="27">5</text>
 <rect x="50" y="0" width="190" height="100" rx="6" fill="#f6f8fa" stroke="#d3d9df"/>
 <g fill="#1f2933"><rect x="74" y="20" width="4" height="64" rx="1"/><rect x="132" y="20" width="5.5" height="64" rx="1"/><rect x="190" y="20" width="7" height="64" rx="1"/></g>
 <g class="m" text-anchor="middle"><text x="76" y="96">2.4</text><text x="135" y="96">2.8</text><text x="194" y="96">3.2 mm</text></g>
 <text class="p" x="262" y="18">PROBLEM</text><text class="t" x="262" y="38">Skin, stem and preload cannot be</text><text class="t" x="262" y="56">known before the first fitting.</text>
 <text class="s" x="262" y="78">SO</text><text class="t" x="262" y="96">Two grips (N, T) and three arm</text><text class="t" x="262" y="114">thicknesses are printed; you swap.</text>
</g>
</svg>
