<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 770" width="640" height="770" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Clip and arm fit. HAND-AUTHORED SOURCE. Panels A and C are schematic (not to scale). Panel B is the clip cross-section at 16 px per mm, numbers from cad/glasses.py FlexParams
     (t_top 1.6, t_jaw 1.4, gap 4.9 under the top plate narrowing to 2.65 [grip N] / 2.35 [grip T] 1.2 mm above the mouth, lead-in 0.4) with an 8 mm tall stem; the real stem is 7.0-9.2 mm tall along the clip.
     Checked 2026-11-23. Nothing here has been tried on real glasses. -->
<style>
 .t{font-size:14px;fill:#1f2933} .tb{font-size:14px;fill:#1f2933;font-weight:700} .m{font-size:12.5px;fill:#6b7785}
 .lead{stroke:#6b7785;stroke-width:1;fill:none} .dim{stroke:#1f2933;stroke-width:1;fill:none}
</style>
<rect width="640" height="770" fill="#fff"/>
<text x="14" y="22" class="tb">A  Where it goes: left side of the head, face on the left</text>
<g transform="translate(0,30)">
 <path d="M70 60 C70 20 200 6 300 20 C380 30 420 90 400 180 C392 230 360 250 330 250 L240 250 C200 250 150 200 100 160 C80 140 70 100 70 60 Z" fill="#f6dcc8" stroke="#b98f74" stroke-width="1.5"/>
 <ellipse cx="318" cy="130" rx="22" ry="44" fill="#eec9b0" stroke="#b98f74" stroke-width="1.5"/>
 <path d="M110 92 H296 C330 92 352 100 360 128 L366 150" fill="none" stroke="#1f2933" stroke-width="5" stroke-linecap="round"/>
 <rect x="102" y="84" width="12" height="16" rx="2" fill="#1f2933"/><text class="m" x="102" y="76">hinge</text>
 <rect x="354" y="116" width="14" height="22" rx="3" fill="#1f2933" transform="rotate(-8 361 127)"/>
 <path d="M366 138 C392 150 404 176 394 206" fill="none" stroke="#1f2933" stroke-width="6" stroke-linecap="round"/>
 <rect x="378" y="196" width="26" height="42" rx="4" fill="#8a949e" stroke="#1f2933" stroke-width="1.5" transform="rotate(10 391 217)"/>
 <g class="dim"><path d="M114 56 H360 M114 50 v12 M360 50 v12"/></g>
 <text class="t" x="237" y="46" text-anchor="middle">127 mm from the hinge</text>
 <g class="lead"><path d="M440 118 L372 126"/><path d="M440 168 L396 176"/><path d="M440 226 L408 222"/></g>
 <text class="tb" x="446" y="114">Clip</text><text class="m" x="446" y="130">on the bend of the stem</text>
 <text class="tb" x="446" y="164">Spring arm</text><text class="m" x="446" y="180">behind the ear</text>
 <text class="tb" x="446" y="222">Exciter</text><text class="m" x="446" y="238">on the mastoid, 2&#8211;5 N</text>
</g>
<line x1="14" y1="296" x2="626" y2="296" stroke="#d3d9df"/>

<text x="14" y="320" class="tb">B  The clip seen from the end of the stem</text>
<!-- before: relaxed clip with dimensions -->
<g transform="translate(150,346) scale(16)" stroke="#1f2933" stroke-width=".09">
  <path d="M0 0 H3.85 V1.6 L2.9 10.9 H1.725 L1.325 9.7 L2.45 1.6 H0 Z M0 0 H-3.85 V1.6 L-2.9 10.9 H-1.725 L-1.325 9.7 L-2.45 1.6 H0 Z" fill="#ff9d3c"/>
</g>
<g class="dim"><path d="M111 372 H189 M111 366 v12 M189 366 v12"/><path d="M129 501 H171 M129 495 v12 M171 495 v12"/></g>
<text class="t" x="150" y="392" text-anchor="middle">4.9</text><text class="t" x="150" y="522" text-anchor="middle">2.65 (N)</text><text class="m" x="150" y="538" text-anchor="middle">2.35 on grip T</text>
<text class="tb" x="150" y="560" text-anchor="middle">before</text>
<!-- arrow: pressed up -->
<path d="M300 480 V400" stroke="#1f2933" stroke-width="2" fill="none"/><path d="M294 410 l6 -12 6 12z" fill="#1f2933"/>
<text class="m" x="300" y="500" text-anchor="middle">stem goes in</text><text class="m" x="300" y="516" text-anchor="middle">from below</text>
<!-- after -->
<g transform="translate(450,346) scale(16)" stroke="#1f2933" stroke-width=".09">
  <path d="M0 0 H3.85 V1.6 L3.35 10.9 H2.2 L1.75 9.7 L2.45 1.6 H0 Z M0 0 H-3.85 V1.6 L-3.35 10.9 H-2.2 L-1.75 9.7 L-2.45 1.6 H0 Z" fill="#ff9d3c"/>
  <rect x="-1.75" y="1.9" width="3.5" height="8" fill="#1f2933" stroke="none"/>
</g>
<text class="tb" x="450" y="560" text-anchor="middle">after</text>
<g class="lead"><path d="M520 358 L496 358"/><path d="M520 470 L492 470"/><path d="M380 430 L430 430" opacity="0"/></g>
<text class="t" x="526" y="362">top plate</text>
<text class="t" x="526" y="474">jaws, sprung</text><text class="t" x="526" y="490">apart</text>
<text class="t" x="400" y="440" text-anchor="end" opacity="0">stem</text>
<text class="m" x="14" y="588">The stem is 3.2&#8211;4.2 mm thick (grip N), wider than the narrowest gap, so the jaws</text>
<text class="m" x="14" y="604">flex apart and grip it. A slit in each jaw lets its three fingers follow the twist of the stem.</text>

<line x1="14" y1="620" x2="626" y2="620" stroke="#d3d9df"/>
<text x="14" y="644" class="tb">C  Exciter on the arm</text>
<g transform="translate(40,660)">
 <path d="M0 70 C60 70 100 56 150 50" fill="none" stroke="#1f2933" stroke-width="7" stroke-linecap="round"/>
 <rect x="150" y="6" width="39" height="80" rx="4" fill="#8a949e" stroke="#1f2933" stroke-width="1.5"/>
 <g fill="#f08a24"><circle cx="154" cy="10" r="4"/><circle cx="185" cy="10" r="4"/><circle cx="154" cy="82" r="4"/><circle cx="185" cy="82" r="4"/></g>
 <circle cx="96" cy="60" r="5" fill="#fff" stroke="#1f2933" stroke-width="1.5"/>
 <path d="M150 30 C128 30 112 48 100 58 C70 66 30 62 4 62" fill="none" stroke="#1f2933" stroke-width="2"/>
 <path d="M150 38 C130 38 114 54 102 62 C72 72 32 68 4 68" fill="none" stroke="#d64545" stroke-width="2"/>
</g>
<g class="lead"><path d="M300 668 L236 668"/><path d="M70 704 L130 716"/></g>
<text class="t" x="308" y="672">a drop of glue at each corner</text>
<text class="t" x="14" y="698">tie hole</text><text class="t" x="308" y="720">wires run out through the tie hole</text><text class="t" x="308" y="738">and down to the bear</text>
<text class="m" x="14" y="758">Plate 13 &#215; 26.5 mm. Arm 2.4 mm if the pad pushes hard, 3.2 mm if it floats off the skin; 2.8 mm is the default.</text>
</svg>
