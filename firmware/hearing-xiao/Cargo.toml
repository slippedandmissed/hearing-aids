[package]
name = "hearing-xiao"
description = "XIAO nRF52840 frontend: PDM in, hearing-dsp, I2S out."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
hearing-profile = { path = "../hearing-profile" }

[dependencies]
hearing-dsp = { path = "../hearing-dsp" }
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
panic-halt = "1.0.0"
