[package]
name = "hearing-dsp"
description = "Hearing-aid signal processing: no_std, no alloc, f32. Shared by the XIAO and desktop frontends."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Lets a std tool read and write a Config (hearing-profile). The firmware does not use it.
serde = ["dep:serde"]

[dependencies]
libm = "0.2"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
