# Every third-party document, dataset, tool and library this project depends on.
# - `make fetch` downloads every entry that has `fetch` (URL or list of URLs) into `dest`.
# - `make docs` turns this file into the bibliography of the manual (docs/build/references.bib), so cite with [@key].
# Fields: key, title, author, year, url (canonical page), fetch (optional direct download URL(s)), dest (optional), license, used_for, note.

[[source]]
key = "max98357a"
title = "MAX98357A/MAX98357B: Tiny, Low-Cost, PCM Class D Amplifier with Class AB Performance"
author = "Analog Devices (Maxim Integrated)"
year = 2019
url = "https://www.analog.com/en/products/max98357a.html"
fetch = "https://www.makerguides.com/wp-content/uploads/2026/01/Datasheet_MAX98357A.pdf"
dest = "docs/datasheets/MAX98357A.pdf"
license = "datasheet, not redistributed (fetched at build time from a third-party mirror)"
used_for = "I2S amplifier on the dangle PCB: SD_MODE channel select, GAIN_SLOT, supported LRCLK rates"

